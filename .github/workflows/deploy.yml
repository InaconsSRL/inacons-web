name: Deploy a cPanel

on:
  push:
    branches: [main]
  # Botón "Run workflow" en Actions: para redesplegar tras cambiar una variable.
  workflow_dispatch:

permissions:
  contents: read

# Dos push seguidos lanzarían dos subidas FTP en paralelo contra el mismo
# directorio y el mismo archivo de estado. No se cancela la que está en curso:
# un deploy a medio subir deja el sitio mezclado.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Tipos y contenido: un error aquí corta el deploy antes de subir nada.
      - name: Comprobar tipos
        run: npm run check

      # Las PUBLIC_* son variables de repositorio (Settings → Secrets and
      # variables → Actions → Variables), no secrets: terminan dentro del HTML
      # y el JavaScript públicos. Vacías, el formulario usa mailto y no se
      # carga analítica.
      - name: Build
        run: npm run build
        env:
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_ANALYTICS_TOKEN: ${{ vars.PUBLIC_ANALYTICS_TOKEN }}

      # La versión exacta que se intentó subir queda descargable 90 días desde
      # la pestaña Actions, aunque el FTP falle: es el rollback.
      - name: Guardar dist/ como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 90

      # El hosting aún no acepta TLS en el FTP (AUTH TLS → 500, oct-2026): la
      # contraseña viaja en claro. Cuando lo active, la variable de repositorio
      # FTP_PROTOCOL = ftps cifra la conexión sin tocar este archivo. `strict`
      # exige un certificado válido para FTP_SERVER: si falla, FTP_SERVER tiene
      # que ser el nombre del certificado (p. ej. el hostname del servidor).
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          security: strict
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./dist/
          server-dir: /sites/home.inacons.com.pe/
