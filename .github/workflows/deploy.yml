name: Deploy a cPanel

on:
  push:
    branches: [main]

# Dos push seguidos sin esto lanzan dos despliegues FTP en paralelo contra el
# mismo directorio del servidor, compartiendo el archivo de estado que la
# acción usa para decidir qué subir. `cancel-in-progress: false` porque un
# deploy a medio subir no se cancela: se espera y se deja correr el segundo
# después, no se corta el primero a la mitad.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Astro inserta las variables PUBLIC_* dentro del JavaScript en el momento
      # del build, no las lee en el servidor: el hosting es Apache, sin Node. Si
      # faltan aqui, /panel/ se publica con el aviso de "sin configurar" en vez
      # de con el formulario de acceso.
      #
      # Se guardan como secrets de GitHub por comodidad, no por secreto: la
      # clave anon es publica por diseno y termina dentro del bundle igual. Lo
      # que protege la base es RLS — ver supabase/migrations/0002_rls.sql.
      - name: Build
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL:      ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      # Hasta ahora, lo único que "recordaba" un build era lo que ya estaba
      # subido al servidor. Sin esto, saber qué había publicado el día X, o
      # volver a la versión anterior, significaba reconstruir un commit viejo
      # a mano y esperar otro ciclo completo de build + FTP. Con esto, la
      # versión exacta que se intentó subir queda descargable durante 90 días
      # desde la pestaña Actions de este run, aunque el FTP de después falle.
      - name: Guardar dist/ como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 90

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./dist/
          server-dir: /sites/home.inacons.com.pe/
          # La lista REEMPLAZA los valores por defecto de la accion, asi que los
          # tres primeros patrones son esos mismos y tienen que quedarse: sin
          # ellos el deploy empezaria a subir .git y node_modules.
          #
          # empresa/config.php lleva las credenciales de MySQL y el hash del
          # admin, y la copia buena solo existe en el servidor. Hoy el CI no lo
          # genera: esta en .gitignore, el checkout no lo trae y el build no
          # tiene que copiar a dist/. Esta linea es para el dia en que alguien
          # lo fuerce con git add -f -- ahi el deploy subiria la version de
          # valores vacios y tumbaria /empresa/ sin ningun error visible.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            empresa/config.php
